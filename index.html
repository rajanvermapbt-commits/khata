const formatCurrency = (amount) => {
  if (amount === undefined || amount === null || isNaN(amount)) return '₹0';
  return new Intl.NumberFormat('en-IN', {style:'currency',currency:'INR',minimumFractionDigits:0,maximumFractionDigits:0}).format(amount);
};
const formatDate = (dateStr) => {
  if (!dateStr) return '—';
  try {
    const d = new Date(dateStr + 'T00:00:00');
    if (isNaN(d.getTime())) return dateStr;
    return d.toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'});
  } catch(e) { return dateStr; }
};
const getOutstanding = (customerId, transactions) => {
  if (!transactions || !customerId) return 0;
  const credits = transactions.filter(t => t.customerId === customerId && t.type === 'credit').reduce((s,t) => s + (Number(t.amount)||0), 0);
  const payments = transactions.filter(t => t.customerId === customerId && t.type === 'payment').reduce((s,t) => s + (Number(t.amount)||0), 0);
  return Math.max(0, credits - payments);
};
const calculatePrediction = (customerId, transactions) => {
  if (!transactions) return {avgDelay:0,onTimePct:50,score:50,prob7d:30,expectedDate:new Date().toISOString().split('T')[0],riskCat:'Medium Risk',reliabilityCat:'Medium Reliability',recommendedAction:'Monitor payment behavior.',totalPayments:0,totalCredits:0};
  const payments = transactions.filter(t => t.customerId === customerId && t.type === 'payment');
  const credits = transactions.filter(t => t.customerId === customerId && t.type === 'credit');
  if (payments.length === 0 && credits.length === 0) return {avgDelay:0,onTimePct:50,score:50,prob7d:30,expectedDate:new Date().toISOString().split('T')[0],riskCat:'Medium Risk',reliabilityCat:'Medium Reliability',recommendedAction:'Newly onboarded customer. Start with initial credit check.',totalPayments:0,totalCredits:0};
  const delays = payments.filter(p => p.delayDays !== undefined).map(p => Number(p.delayDays)||0);
  const avgDelay = delays.length > 0 ? delays.reduce((a,b)=>a+b,0)/delays.length : 0;
  const onTimeCount = delays.filter(d => d <= 0).length;
  const onTimePct = delays.length > 0 ? (onTimeCount/delays.length)*100 : 50;
  let score = 0;
  score += Math.min(50, onTimePct * 0.5);
  score += Math.max(0, 30 - Math.max(0, avgDelay) * 0.8);
  score += Math.min(20, payments.length * 3);
  score = Math.max(0, Math.min(100, Math.round(score)));
  const outstanding = getOutstanding(customerId, transactions);
  let prob7d = score * 0.7 - (Math.max(0, avgDelay) > 14 ? 15 : 0);
  if (outstanding === 0) prob7d = 0;
  prob7d = Math.max(5, Math.min(90, Math.round(prob7d)));
  const daysUntil = Math.max(1, Math.round(Math.max(0, avgDelay)));
  const expDate = new Date(); expDate.setDate(expDate.getDate() + daysUntil);
  const riskCat = score >= 80 ? 'Low Risk' : score >= 50 ? 'Medium Risk' : 'High Risk';
  const reliabilityCat = score >= 80 ? 'High Reliability' : score >= 50 ? 'Medium Reliability' : 'Low Reliability';
  const recommendedAction = score >= 80 ? 'Excellent payment history. Standard follow-up is sufficient.' : score >= 50 ? 'Send a polite reminder 3-5 days before the due date.' : 'Follow up actively and consider limiting credit until outstanding dues are cleared.';
  return {avgDelay:Math.round(avgDelay),onTimePct:Math.round(onTimePct),score,prob7d,expectedDate:expDate.toISOString().split('T')[0],riskCat,reliabilityCat,recommendedAction,totalPayments:payments.length,totalCredits:credits.length};
};
const calculateBusinessHealth = (customers, transactions) => {
  if (!customers || customers.length === 0) return {healthScore:70,healthCat:'Good',collectionRate:80,overdueRatio:10,avgReliability:70};
  const totalCredits = transactions.filter(t=>t.type==='credit').reduce((s,t)=>s+Number(t.amount||0),0);
  const totalPayments = transactions.filter(t=>t.type==='payment').reduce((s,t)=>s+Number(t.amount||0),0);
  const collectionRate = totalCredits > 0 ? (totalPayments/totalCredits)*100 : 0;
  const totalOutstanding = customers.reduce((s,c)=>s+getOutstanding(c.id,transactions),0);
  const today = '2026-10-30';
  const overdueCredits = transactions.filter(t=>t.type==='credit'&&t.dueDate&&t.dueDate<today);
  const overdueAmount = overdueCredits.reduce((s,t)=>s+Number(t.amount||0),0);
  const overdueRatio = totalOutstanding > 0 ? Math.min(100,(overdueAmount/totalOutstanding)*100) : 0;
  const avgReliability = customers.reduce((s,c)=>s+calculatePrediction(c.id,transactions).score,0)/Math.max(1,customers.length);
  let healthScore = collectionRate*0.4 + (100-overdueRatio)*0.3 + avgReliability*0.3;
  healthScore = Math.max(0,Math.min(100,Math.round(healthScore)));
  const healthCat = healthScore>=75?'Excellent':healthScore>=50?'Good':healthScore>=30?'Fair':'Needs Attention';
  return {healthScore,healthCat,collectionRate:Math.round(collectionRate),overdueRatio:Math.round(overdueRatio),avgReliability:Math.round(avgReliability)};
};
const exportToCSV = (filename, headers, rows) => {
  const csvContent = [
    headers.map(h=>`"${String(h).replace(/"/g,'""')}"`).join(','),
    ...rows.map(row=>row.map(cell=>`"${String(cell===null||cell===undefined?'':cell).replace(/"/g,'""')}"`).join(','))
  ].join('\r\n');
  const blob = new Blob([csvContent],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = filename.endsWith('.csv')?filename:filename+'.csv';
  document.body.appendChild(link); link.click();
  document.body.removeChild(link); URL.revokeObjectURL(url);
};

// --- APP STATE MANAGEMENT ---
const AppContext = React.createContext();

const buildInitialState = () => {
  const today = new Date().toISOString().split('T')[0];
  const notifications = SAMPLE_CUSTOMERS
    .filter(c => ['c4','c8','c11','c13','c15','c19'].includes(c.id))
    .map((c, i) => ({
      id: 'n' + (i+1),
      type: 'overdue',
      title: `Overdue: ${c.name}`,
      message: `Outstanding payment is overdue. Immediate follow-up recommended.`,
      date: today,
      read: false
    }));
  return {
    customers: SAMPLE_CUSTOMERS,
    transactions: SAMPLE_TRANSACTIONS,
    reminders: SAMPLE_REMINDERS,
    settings: {
      businessName: 'Bharat Traders',
      ownerName: 'Amit Kumar',
      phone: '9876543210',
      email: 'amit@bharattraders.in',
      address: 'Delhi, India',
      currency: 'INR',
      theme: 'light',
      currentPlan: 'Pro'
    },
    currentPage: 'dashboard',
    selectedCustomerId: null,
    sidebarOpen: true,
    showSearch: false,
    showNotifications: false,
    notifications,
    toasts: [],
    activeModal: null,
    modalPayload: null,
  };
};

function appReducer(state, action) {
  switch (action.type) {
    case 'ADD_CUSTOMER':
      return { ...state, customers: [...state.customers, action.payload] };
    case 'UPDATE_CUSTOMER':
      return { ...state, customers: state.customers.map(c => c.id === action.payload.id ? { ...c, ...action.payload } : c) };
    case 'DELETE_CUSTOMER':
      return { ...state, customers: state.customers.filter(c => c.id !== action.payload), transactions: state.transactions.filter(t => t.customerId !== action.payload), selectedCustomerId: state.selectedCustomerId === action.payload ? null : state.selectedCustomerId };
    case 'ADD_TRANSACTION':
      return { ...state, transactions: [...state.transactions, action.payload] };
    case 'ADD_REMINDER':
      return { ...state, reminders: [...state.reminders, action.payload] };
    case 'UPDATE_REMINDER':
      return { ...state, reminders: state.reminders.map(r => r.id === action.payload.id ? { ...r, ...action.payload } : r) };
    case 'UPDATE_SETTINGS':
      return { ...state, settings: { ...state.settings, ...action.payload } };
    case 'NAVIGATE':
      return { ...state, currentPage: action.payload, selectedCustomerId: action.payload !== 'customers' ? null : state.selectedCustomerId, sidebarOpen: window.innerWidth >= 1024 ? state.sidebarOpen : false };
    case 'SELECT_CUSTOMER':
      return { ...state, selectedCustomerId: action.payload, currentPage: 'customers' };
    case 'TOGGLE_SIDEBAR':
      return { ...state, sidebarOpen: !state.sidebarOpen };
    case 'TOGGLE_SEARCH':
      return { ...state, showSearch: !state.showSearch };
    case 'TOGGLE_NOTIFICATIONS':
      return { ...state, showNotifications: !state.showNotifications };
    case 'MARK_NOTIFICATIONS_READ':
      return { ...state, notifications: state.notifications.map(n => ({ ...n, read: true })) };
    case 'OPEN_MODAL':
      return { ...state, activeModal: action.payload.modal, modalPayload: action.payload.data || null };
    case 'CLOSE_MODAL':
      return { ...state, activeModal: null, modalPayload: null };
    case 'ADD_TOAST': {
      const toast = { ...action.payload, id: 'toast_' + Date.now() };
      setTimeout(() => {}, 4000);
      return { ...state, toasts: [...state.toasts.slice(-3), toast] };
    }
    case 'DISMISS_TOAST':
      return { ...state, toasts: state.toasts.filter(t => t.id !== action.payload) };
    case 'RESET_DEMO':
      return buildInitialState();
    case 'TOGGLE_THEME':
      return { ...state, settings: { ...state.settings, theme: state.settings.theme === 'dark' ? 'light' : 'dark' } };
    default:
      return state;
  }
}

function AppProvider({ children }) {
  const [state, dispatch] = React.useReducer(appReducer, null, () => {
    try {
      const saved = localStorage.getItem('khata_state_v2');
      if (saved) return JSON.parse(saved);
    } catch(e) {}
    return buildInitialState();
  });

  React.useEffect(() => {
    try {
      localStorage.setItem('khata_state_v2', JSON.stringify(state));
    } catch(e) {}
  }, [state]);

  // Auto-dismiss toasts after 4 seconds
  React.useEffect(() => {
    if (state.toasts.length > 0) {
      const timer = setTimeout(() => {
        dispatch({ type: 'DISMISS_TOAST', payload: state.toasts[0].id });
      }, 4000);
      return () => clearTimeout(timer);
    }
  }, [state.toasts]);

  // Apply dark mode class
  React.useEffect(() => {
    if (state.settings.theme === 'dark') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  }, [state.settings.theme]);

  return (
    <AppContext.Provider value={{ state, dispatch }}>
      {children}
    </AppContext.Provider>
  );
}

const useApp = () => React.useContext(AppContext);

const ReliabilityBadge = ({ score }) => {
  let color = 'bg-red-100 text-red-700 border-red-200 dark:bg-red-900/30 dark:text-red-300';
  let label = 'Low Reliability';
  if (score >= 80) {
    color = 'bg-emerald-100 text-emerald-800 border-emerald-200 dark:bg-emerald-900/30 dark:text-emerald-300';
    label = 'High Reliability';
  } else if (score >= 50) {
    color = 'bg-amber-100 text-amber-800 border-amber-200 dark:bg-amber-900/30 dark:text-amber-300';
    label = 'Medium Reliability';
  }
  return (
    <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold border ${color}`}>
      <span className="w-1.5 h-1.5 mr-1.5 rounded-full bg-current"></span>
      {score} pts • {label}
    </span>
  );
};

const RiskTag = ({ riskCat }) => {
  let style = 'bg-red-50 text-red-600 border-red-200 dark:bg-red-950/40 dark:text-red-400';
  if (riskCat === 'Low Risk') {

  }
  return (
    <span className={`px-2 py-0.5 text-xs font-medium rounded border ${style}`}>
      {riskCat}
    </span>
  );
};

// --- GLOBAL SEARCH MODAL ---
const GlobalSearch = () => {
  const { state, dispatch } = useApp();
  const [query, setQuery] = React.useState('');

  if (!state.showSearch) return null;

  const filteredCustomers = query.trim() ? state.customers.filter(c => 
    c.name.toLowerCase().includes(query.toLowerCase()) ||
    c.phone.includes(query) ||
    c.notes.toLowerCase().includes(query.toLowerCase())
  ) : [];

  const filteredTransactions = query.trim() ? state.transactions.filter(t => {
    const cust = state.customers.find(c => c.id === t.customerId);
    const custName = cust ? cust.name.toLowerCase() : '';
    return custName.includes(query.toLowerCase()) ||
      t.description.toLowerCase().includes(query.toLowerCase()) ||
      String(t.amount).includes(query);
  }).slice(0, 8) : [];

  const handleSelectCustomer = (cid) => {
    dispatch({ type: 'SELECT_CUSTOMER', payload: cid });
    dispatch({ type: 'NAVIGATE', payload: 'customers' });
    dispatch({ type: 'TOGGLE_SEARCH' });
  };

  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center pt-16 px-4 bg-black/60 backdrop-blur-sm">
      <div className="w-full max-w-2xl bg-white dark:bg-royal-purple rounded-xl shadow-2xl border border-light-lavender overflow-hidden fade-in">
        
        {/* Search Input Bar */}
        <div className="flex items-center px-4 py-3.5 border-b border-light-lavender">
          <Icon name="search" className="w-5 h-5 text-rich-teal mr-3" />
          <input
            type="text"
            autoFocus
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            placeholder="Type customer name, phone, invoice, item or amount..."
            className="w-full bg-transparent text-charcoal dark:text-white placeholder-muted-grey text-base outline-none"
          />
          <button 
            onClick={() => dispatch({ type: 'TOGGLE_SEARCH' })}
            className="p-1 rounded text-muted-grey hover:text-charcoal dark:hover:text-white"
          >
            <Icon name="x" className="w-5 h-5" />
          </button>
        </div>

        {/* Results Area */}
        <div className="max-h-96 overflow-y-auto p-4 space-y-4">
          {!query.trim() ? (
            <div className="py-8 text-center text-muted-grey text-sm">
              <Icon name="search" className="w-8 h-8 mx-auto mb-2 opacity-30 text-rich-teal" />
              <p>Type to search across all 20 business customers and transaction history.</p>
            </div>
          ) : (
            <>
              {/* Customer Results */}
              <div>
                <h4 className="text-xs font-semibold uppercase tracking-wider text-muted-grey mb-2">Customers ({filteredCustomers.length})</h4>
                {filteredCustomers.length === 0 ? (
                  <p className="text-xs text-muted-grey italic">No matching customers found.</p>
                ) : (
                  <div className="divide-y divide-light-lavender dark:divide-rich-plum/40 border border-light-lavender dark:border-rich-plum/40 rounded-lg overflow-hidden">
                    {filteredCustomers.map(c => {
                      const out = getOutstanding(c.id, state.transactions);
                      const pred = calculatePrediction(c.id, state.transactions);
                      return (
                        <div 
                          key={c.id} 
                          onClick={() => handleSelectCustomer(c.id)}
                          className="p-3 flex items-center justify-between hover:bg-warm-ivory dark:hover:bg-rich-plum/40 cursor-pointer transition"
                        >
                          <div>
                            <p className="text-sm font-semibold text-charcoal dark:text-white">{c.name}</p>
                            <p className="text-xs text-muted-grey">{c.phone} • {c.notes}</p>
                          </div>
                          <div className="text-right">
                            <p className="text-sm font-bold text-royal-purple dark:text-rich-teal">{formatCurrency(out)}</p>
                            <span className="text-[10px] text-muted-grey">{pred.riskCat}</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

              {/* Transaction Results */}
              <div>
                <h4 className="text-xs font-semibold uppercase tracking-wider text-muted-grey mb-2">Transactions ({filteredTransactions.length})</h4>
                {filteredTransactions.length === 0 ? (
                  <p className="text-xs text-muted-grey italic">No matching transactions found.</p>
                ) : (
                  <div className="divide-y divide-light-lavender dark:divide-rich-plum/40 border border-light-lavender dark:border-rich-plum/40 rounded-lg overflow-hidden">
                    {filteredTransactions.map(t => {
                      const cust = state.customers.find(c => c.id === t.customerId);
                      return (
                        <div 
                          key={t.id}
                          onClick={() => {
                            dispatch({ type: 'NAVIGATE', payload: 'transactions' });
                            dispatch({ type: 'TOGGLE_SEARCH' });
                          }}
                          className="p-3 flex items-center justify-between hover:bg-warm-ivory dark:hover:bg-rich-plum/40 cursor-pointer transition"
                        >
                          <div>
                            <div className="flex items-center space-x-2">
                              <span className={`text-[10px] uppercase font-bold px-1.5 py-0.5 rounded ${t.type === 'credit' ? 'bg-purple-100 text-purple-800 dark:bg-purple-900/40 dark:text-purple-300' : 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-300'}`}>
                                {t.type}
                              </span>
                              <span className="text-xs font-semibold text-charcoal dark:text-white">{cust?.name || 'Unknown'}</span>
                            </div>
                            <p className="text-xs text-muted-grey mt-0.5">{t.description}</p>
                          </div>
                          <div className="text-right">
                            <span className={`text-sm font-bold ${t.type === 'credit' ? 'text-charcoal dark:text-white' : 'text-emerald-custom'}`}>
                              {t.type === 'payment' ? '+' : ''}{formatCurrency(t.amount)}
                            </span>
                            <p className="text-[10px] text-muted-grey">{formatDate(t.date)}</p>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </>
          )}
        </div>

        <div className="px-4 py-2.5 bg-warm-ivory dark:bg-rich-plum/30 border-t border-light-lavender text-xs text-muted-grey flex justify-between">
          <span>Press ESC to exit</span>
          <span>Tip: Click any customer to inspect full payment dossier</span>
        </div>

      </div>
    </div>
  );
};

// --- TOAST NOTIFICATION CONTAINER ---
const ToastContainer = () => {
  const { state, dispatch } = useApp();

  return (
    <div className="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none max-w-sm w-full">
      {state.toasts.map(toast => {
        let border = 'border-rich-teal text-rich-teal';
        let icon = 'check';
        if (toast.type === 'error') {
          border = 'border-red-custom text-red-custom';
          icon = 'alert';
        } else if (toast.type === 'warning') {
          border = 'border-amber-custom text-amber-custom';
          icon = 'alert';
        } else if (toast.type === 'info') {
          border = 'border-rich-plum text-rich-plum';
          icon = 'info';
        }

        return (
          <div 
            key={toast.id}
            className={`pointer-events-auto bg-white dark:bg-royal-purple border-l-4 ${border} p-4 rounded-xl shadow-xl border border-light-lavender flex items-start space-x-3 fade-in`}

            <div className="flex-1">
              <p className="text-xs font-bold text-charcoal dark:text-white">{toast.title}</p>
              <p className="text-xs text-muted-grey mt-0.5 leading-tight">{toast.message}</p>
            </div>
            <button 
              onClick={() => dispatch({ type: 'DISMISS_TOAST', payload: toast.id })}

// --- APP STATE MANAGEMENT ---
const AppContext = React.createContext();

const buildInitialState = () => {
  const today = new Date().toISOString().split('T')[0];
  const notifications = SAMPLE_CUSTOMERS
    .filter(c => ['c4','c8','c11','c13','c15','c19'].includes(c.id))
    .map((c, i) => ({
      id: 'n' + (i+1),
      type: 'overdue',
      title: 'Overdue: ' + c.name,
      message: 'Outstanding payment is overdue. Immediate follow-up recommended.',
      date: today,
      read: false
    }));
  return {
    customers: SAMPLE_CUSTOMERS,
    transactions: SAMPLE_TRANSACTIONS,
    reminders: SAMPLE_REMINDERS,
    settings: {
      businessName: 'Bharat Traders',
      ownerName: 'Amit Kumar',
      phone: '9876543210',
      email: 'amit@bharattraders.in',
      address: 'Delhi, India',
      currency: 'INR',
      theme: 'light',
      currentPlan: 'Pro'
    },
    currentPage: 'dashboard',
    selectedCustomerId: null,
    sidebarOpen: true,
    showSearch: false,
    showNotifications: false,
    notifications,
    toasts: [],
    activeModal: null,
    modalPayload: null,
  };
};

function appReducer(state, action) {
  switch (action.type) {
    case 'ADD_CUSTOMER':
      return { ...state, customers: [...state.customers, action.payload] };
    case 'UPDATE_CUSTOMER':
      return { ...state, customers: state.customers.map(c => c.id === action.payload.id ? { ...c, ...action.payload } : c) };
    case 'DELETE_CUSTOMER':
      return { ...state, customers: state.customers.filter(c => c.id !== action.payload), transactions: state.transactions.filter(t => t.customerId !== action.payload), selectedCustomerId: state.selectedCustomerId === action.payload ? null : state.selectedCustomerId };
    case 'ADD_TRANSACTION':
      return { ...state, transactions: [...state.transactions, action.payload] };
    case 'ADD_REMINDER':
      return { ...state, reminders: [...state.reminders, action.payload] };
    case 'UPDATE_REMINDER':
      return { ...state, reminders: state.reminders.map(r => r.id === action.payload.id ? { ...r, ...action.payload } : r) };
    case 'UPDATE_SETTINGS':
      return { ...state, settings: { ...state.settings, ...action.payload } };
    case 'NAVIGATE':
      return { ...state, currentPage: action.payload, selectedCustomerId: action.payload !== 'customers' ? null : state.selectedCustomerId, sidebarOpen: typeof window !== 'undefined' && window.innerWidth >= 1024 ? state.sidebarOpen : false };
    case 'SELECT_CUSTOMER':
      return { ...state, selectedCustomerId: action.payload, currentPage: 'customers' };
    case 'TOGGLE_SIDEBAR':
      return { ...state, sidebarOpen: !state.sidebarOpen };
    case 'TOGGLE_SEARCH':
      return { ...state, showSearch: !state.showSearch };
    case 'TOGGLE_NOTIFICATIONS':
      return { ...state, showNotifications: !state.showNotifications };
    case 'MARK_NOTIFICATIONS_READ':
      return { ...state, notifications: state.notifications.map(n => ({ ...n, read: true })) };
    case 'OPEN_MODAL':
      return { ...state, activeModal: action.payload.modal, modalPayload: action.payload.data || null };
    case 'CLOSE_MODAL':
      return { ...state, activeModal: null, modalPayload: null };
    case 'ADD_TOAST': {
      const toast = { ...action.payload, id: 'toast_' + Date.now() };
      return { ...state, toasts: [...state.toasts.slice(-3), toast] };
    }
    case 'DISMISS_TOAST':
      return { ...state, toasts: state.toasts.filter(t => t.id !== action.payload) };
    case 'RESET_DEMO':
      return buildInitialState();
    case 'TOGGLE_THEME':
      return { ...state, settings: { ...state.settings, theme: state.settings.theme === 'dark' ? 'light' : 'dark' } };
    default:
      return state;
  }
}

function AppProvider({ children }) {
  const [state, dispatch] = React.useReducer(appReducer, null, () => {
    try {
      const saved = localStorage.getItem('khata_state_v2');
      if (saved) return JSON.parse(saved);
    } catch(e) {}
    return buildInitialState();
  });

  React.useEffect(() => {
    try { localStorage.setItem('khata_state_v2', JSON.stringify(state)); } catch(e) {}
  }, [state]);

  React.useEffect(() => {
    if (state.toasts.length > 0) {
      const timer = setTimeout(() => {
        dispatch({ type: 'DISMISS_TOAST', payload: state.toasts[0].id });
      }, 4000);
      return () => clearTimeout(timer);
    }
  }, [state.toasts]);

  return (
    <AppContext.Provider value={{ state, dispatch }}>
      {children}
    </AppContext.Provider>
  );
}

const useApp = () => React.useContext(AppContext);

const ReliabilityBadge = ({ score }) => {
  let color = 'bg-red-100 text-red-700 border-red-200 dark:bg-red-900/30 dark:text-red-300';
  let label = 'Low Reliability';
  if (score >= 80) {
    color = 'bg-emerald-100 text-emerald-800 border-emerald-200 dark:bg-emerald-900/30 dark:text-emerald-300';
    label = 'High Reliability';
  } else if (score >= 50) {
    color = 'bg-amber-100 text-amber-800 border-amber-200 dark:bg-amber-900/30 dark:text-amber-300';
    label = 'Medium Reliability';
  }
  return (
    <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold border ${color}`}>
      <span className="w-1.5 h-1.5 mr-1.5 rounded-full bg-current"></span>
      {score} pts • {label}
    </span>
  );
};

const RiskTag = ({ riskCat }) => {
  let style = 'bg-red-50 text-red-600 border-red-200 dark:bg-red-950/40 dark:text-red-400';
  if (riskCat === 'Low Risk') {
    style = 'bg-emerald-50 text-emerald-600 border-emerald-200 dark:bg-emerald-950/40 dark:text-emerald-400';
  } else if (riskCat === 'Medium Risk') {
    style = 'bg-amber-50 text-amber-600 border-amber-200 dark:bg-amber-950/40 dark:text-amber-400';
  }
  return (<span className={`px-2 py-0.5 text-xs font-medium rounded border ${style}`}>{riskCat}</span>);
};

const AddTransactionModal = () => {
  const { state, dispatch } = useApp();
  const preId = state.modalPayload?.customerId || (state.customers[0]?.id || '');
  const [customerId, setCustomerId] = React.useState(preId);
  const [type, setType] = React.useState(state.modalPayload?.txType || 'payment');
  const [amount, setAmount] = React.useState('');
  const [date, setDate] = React.useState(new Date().toISOString().split('T')[0]);
  const [dueDate, setDueDate] = React.useState(new Date(Date.now() + 15 * 86400000).toISOString().split('T')[0]);
  const [description, setDescription] = React.useState('');
  const [warnConfirmed, setWarnConfirmed] = React.useState(false);
  const currentOutstanding = getOutstanding(customerId, state.transactions);
  const isOverpayment = type === 'payment' && Number(amount) > currentOutstanding && currentOutstanding > 0;
  const handleSubmit = (e) => {
    e.preventDefault();
    if (!customerId || !amount || Number(amount) <= 0) return;
    if (isOverpayment && !warnConfirmed) { setWarnConfirmed(true); return; }
    const newTx = { id: 't_' + Date.now(), customerId, type, amount: Number(amount), date, dueDate: type === 'credit' ? dueDate : undefined, description: description.trim() || (type === 'payment' ? 'Payment received' : 'Credit invoice'), delayDays: type === 'payment' ? 0 : undefined };

      {/* Charts Grid */}
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div className="bg-white dark:bg-royal-purple rounded-2xl p-6 border border-light-lavender shadow-card">
          <h3 className="font-bold text-sm text-charcoal dark:text-white mb-1">Monthly Collection Trend</h3>

        <div className="bg-white dark:bg-royal-purple rounded-2xl p-6 border border-light-lavender shadow-card">
          <h3 className="font-bold text-sm text-charcoal dark:text-white mb-1">Overdue Receivables Aging Trend</h3>
          <p className="text-xs text-muted-grey mb-4">Total delayed dues over recent months</p>
          <div className="h-56">{ResponsiveContainer ? <ResponsiveContainer width="100%" height="100%"><AreaChart data={overdueTrendData}><defs><linearGradient id="overdueGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#EF4444" stopOpacity={0.4}/><stop offset="95%" stopColor="#EF4444" stopOpacity={0.0}/></linearGradient></defs><CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#E9E1F0" /><XAxis dataKey="month" tick={{fontSize:11}} /><YAxis tick={{fontSize:11}} tickFormatter={v => '₹'+v/1000+'k'} /><Tooltip formatter={v => formatCurrency(v)} /><Area type="monotone" dataKey="Overdue" stroke="#EF4444" strokeWidth={2.5} fillOpacity={1} fill="url(#overdueGrad)" /></AreaChart></ResponsiveContainer> : null}</div>
        </div>
      </div>

      {/* 2-Column Lists */}
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div className="bg-white dark:bg-royal-purple rounded-2xl p-6 border border-light-lavender shadow-card">
          <div className="flex items-center justify-between mb-4"><div><h3 className="font-bold text-sm text-charcoal dark:text-white">Upcoming Expected Collections</h3><p className="text-xs text-muted-grey">High probability forecast for next 7 days</p></div><button onClick={() => dispatch({type:'NAVIGATE',payload:'cashflow'})} className="text-xs text-rich-teal font-semibold hover:underline">View Calendar →</button></div>
          <div className="divide-y divide-light-lavender dark:divide-rich-plum/40">
            {next7DaysList.map(({ customer, pred, out }) => (
              <div key={customer.id} className="py-3 flex items-center justify-between">
                <div><div className="flex items-center space-x-2"><span className="font-semibold text-xs text-charcoal dark:text-white">{customer.name}</span><span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800">{pred.prob7d}% Probable</span></div><p className="text-[11px] text-muted-grey mt-0.5">Expected by {formatDate(pred.expectedDate)} • {customer.notes}</p></div>
                <div className="text-right"><span className="font-bold text-xs text-royal-purple dark:text-rich-teal">{formatCurrency(out)}</span><button onClick={() => dispatch({type:'OPEN_MODAL',payload:{modal:'add_reminder',customerId:customer.id}})} className="block text-[11px] text-rich-teal hover:underline font-medium mt-0.5">Set Nudge</button></div>
              </div>
            ))}
            {next7DaysList.length === 0 && <p className="text-xs text-muted-grey py-4 text-center">No high-probability collections predicted this week.</p>}
          </div>
        </div>
        <div className="bg-white dark:bg-royal-purple rounded-2xl p-6 border border-light-lavender shadow-card">
          <div className="flex items-center justify-between mb-4"><div><h3 className="font-bold text-sm text-charcoal dark:text-white">Recent Transactions</h3><p className="text-xs text-muted-grey">Latest credits and payment settlements</p></div><button onClick={() => dispatch({type:'NAVIGATE',payload:'transactions'})} className="text-xs text-rich-teal font-semibold hover:underline">All Transactions →</button></div>
          <div className="divide-y divide-light-lavender dark:divide-rich-plum/40">
            {recentTxs.map(t => {
              const cust = customers.find(c => c.id === t.customerId);
              return (
                <div key={t.id} className="py-2.5 flex items-center justify-between">
                  <div className="flex items-center space-x-2.5">
                    <div className={`p-2 rounded-lg ${t.type === 'payment' ? 'bg-emerald-100 text-emerald-700' : 'bg-purple-100 text-purple-700'}`}><Icon name={t.type === 'payment' ? 'check' : 'receipt'} className="w-4 h-4" /></div>
                    <div><p className="font-semibold text-xs text-charcoal dark:text-white truncate max-w-[160px]">{cust?.name || 'Customer'}</p><p className="text-[10px] text-muted-grey">{formatDate(t.date)} • {t.description}</p></div>
                  </div>
                  <div className="text-right"><span className={`font-bold text-xs ${t.type === 'payment' ? 'text-emerald-600' : 'text-charcoal dark:text-white'}`}>{t.type === 'payment' ? '+' : ''}{formatCurrency(t.amount)}</span><span className="block text-[10px] text-muted-grey uppercase">{t.type}</span></div>
                </div>
              );

          </div>
        </div>
      </div>

      {/* 4 Bottom Sections */}
      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <div className="bg-white dark:bg-royal-purple rounded-xl p-4 border border-light-lavender shadow-card">
          <h4 className="text-xs font-bold uppercase tracking-wider text-muted-grey mb-3 flex items-center justify-between"><span>Top Debtors</span><span className="text-[10px] text-red-500 font-bold">Highest Dues</span></h4>
          <div className="space-y-3">{topOutstanding.map(c => <div key={c.id} className="flex items-center justify-between text-xs"><span className="font-medium text-charcoal dark:text-white truncate max-w-[110px]">{c.name}</span><span className="font-bold text-royal-purple dark:text-rich-teal">{formatCurrency(c.out)}</span></div>)}</div>
        </div>
        <div className="bg-white dark:bg-royal-purple rounded-xl p-4 border border-light-lavender shadow-card">
          <h4 className="text-xs font-bold uppercase tracking-wider text-muted-grey mb-3 flex items-center justify-between"><span>Priority Follow-ups</span><span className="text-[10px] text-amber-500 font-bold">Action Needed</span></h4>
          <div className="space-y-3">{priorityFollowUps.map(c => <div key={c.id} className="flex items-center justify-between text-xs"><div><p className="font-medium text-charcoal dark:text-white truncate max-w-[100px]">{c.name}</p><span className="text-[10px] text-red-500">{c.pred.riskCat}</span></div><button onClick={() => dispatch({type:'OPEN_MODAL',payload:{modal:'add_reminder',customerId:c.id}})} className="px-2 py-1 bg-rich-plum/10 text-rich-plum dark:text-soft-mint rounded font-semibold text-[10px] hover:bg-rich-plum/20">Send Nudge</button></div>)}</div>
        </div>
        <div className="bg-white dark:bg-royal-purple rounded-xl p-4 border border-light-lavender shadow-card">
          <h4 className="text-xs font-bold uppercase tracking-wider text-muted-grey mb-3 flex items-center justify-between"><span>Likely to Pay Soon</span><span className="text-[10px] text-emerald-600 font-bold">&gt;60% Score</span></h4>
          <div className="space-y-3">{likelyToPaySoon.map(c => <div key={c.id} className="flex items-center justify-between text-xs"><span className="font-medium text-charcoal dark:text-white truncate max-w-[110px]">{c.name}</span><span className="px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 text-[10px] font-bold">{c.pred.prob7d}% in 7d</span></div>)}</div>
        </div>
        <div className="bg-white dark:bg-royal-purple rounded-xl p-4 border border-light-lavender shadow-card">
          <h4 className="text-xs font-bold uppercase tracking-wider text-muted-grey mb-3 flex items-center justify-between"><span>High Risk Accounts</span><span className="text-[10px] text-red-600 font-bold">&lt;50 Score</span></h4>
          <div className="space-y-3">{highRiskCustomers.map(c => <div key={c.id} className="flex items-center justify-between text-xs"><div><p className="font-medium text-charcoal dark:text-white truncate max-w-[110px]">{c.name}</p><span className="text-[10px] text-muted-grey">{c.pred.avgDelay}d avg delay</span></div><span className="font-bold text-red-500">{formatCurrency(c.out)}</span></div>)}</div>
        </div>
      </div>
    </div>
  );
};

// --- PAGE 2: CUSTOMERS DIRECTORY ---

const CustomersPage = () => {
  const { state, dispatch } = useApp();
  const { customers, transactions, selectedCustomerId } = state;
  if (selectedCustomerId) return <CustomerProfilePage customerId={selectedCustomerId} />;

  const [search, setSearch] = React.useState('');
  const [filterRel, setFilterRel] = React.useState('all');
  const [filterRisk, setFilterRisk] = React.useState('all');
  const [sortBy, setSortBy] = React.useState('outstanding-desc');

  const customerList = customers.map(c => {
    const out = getOutstanding(c.id, transactions);
    const pred = calculatePrediction(c.id, transactions);
    const payments = transactions.filter(t => t.customerId === c.id && t.type === 'payment');
    const lastPayment = payments.length > 0 ? payments.sort((a,b) => (b.date||'').localeCompare(a.date||''))[0] : null;
    return { ...c, out, pred, lastPayment };
  });

  const filtered = customerList.filter(c => {
    const matchesSearch = c.name.toLowerCase().includes(search.toLowerCase()) || c.phone.includes(search) || (c.notes||'').toLowerCase().includes(search.toLowerCase());
    const matchesRel = filterRel === 'all' || (filterRel === 'high' && c.pred.score >= 80) || (filterRel === 'medium' && c.pred.score >= 50 && c.pred.score < 80) || (filterRel === 'low' && c.pred.score < 50);
    const matchesRisk = filterRisk === 'all' || c.pred.riskCat.toLowerCase().includes(filterRisk);
    return matchesSearch && matchesRel && matchesRisk;
  });

  filtered.sort((a, b) => {
    if (sortBy === 'outstanding-desc') return b.out - a.out;
    if (sortBy === 'outstanding-asc') return a.out - b.out;
    if (sortBy === 'score-desc') return b.pred.score - a.pred.score;
    if (sortBy === 'name') return a.name.localeCompare(b.name);
    return 0;
  });

  const sc = "px-3 py-2 bg-warm-ivory dark:bg-rich-plum/20 border border-light-lavender rounded-lg text-xs text-charcoal dark:text-white outline-none";

  return (
    <div className="space-y-6 fade-in">
      <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
        <div><h2 className="text-xl font-bold text-charcoal dark:text-white">Customer Receivables Ledger</h2><p className="text-xs text-muted-grey mt-0.5">Manage credit limits, payment reliability profiles, and outstanding balances.</p></div>
        <button onClick={() => dispatch({ type: 'OPEN_MODAL', payload: { modal: 'add_customer' } })} className="px-4 py-2.5 bg-rich-teal hover:bg-[#2fa090] text-white text-xs font-bold rounded-xl shadow-sm flex items-center space-x-1.5 transition"><Icon name="plus" className="w-4 h-4" /><span>Add New Customer</span></button>
      </div>
      <div className="bg-white dark:bg-royal-purple p-4 rounded-xl border border-light-lavender shadow-sm flex flex-col md:flex-row gap-3 items-stretch md:items-center justify-between">
        <div className="relative flex-1"><Icon name="search" className="w-4 h-4 text-muted-grey absolute left-3.5 top-3" /><input type="text" placeholder="Search by name, phone, or category..." value={search} onChange={e => setSearch(e.target.value)} className="w-full pl-9 pr-3.5 py-2 bg-warm-ivory dark:bg-rich-plum/20 border border-light-lavender rounded-lg text-xs text-charcoal dark:text-white outline-none" /></div>
        <div className="flex flex-wrap items-center gap-2">
          <select value={filterRel} onChange={e => setFilterRel(e.target.value)} className={sc}><option value="all">All Reliability</option><option value="high">High (&ge;80)</option><option value="medium">Medium (50-79)</option><option value="low">Low (&lt;50)</option></select>
          <select value={filterRisk} onChange={e => setFilterRisk(e.target.value)} className={sc}><option value="all">All Risk Tiers</option><option value="low">Low Risk</option><option value="medium">Medium Risk</option><option value="high">High Risk</option></select>
          <select value={sortBy} onChange={e => setSortBy(e.target.value)} className={sc}><option value="outstanding-desc">Outstanding: High to Low</option><option value="outstanding-asc">Outstanding: Low to High</option><option value="score-desc">Reliability: High to Low</option><option value="name">Name: A to Z</option></select>
        </div>
      </div>
      <div className="bg-white dark:bg-royal-purple rounded-xl border border-light-lavender shadow-card overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-left border-collapse">
            <thead><tr className="bg-warm-ivory dark:bg-rich-plum/40 border-b border-light-lavender text-[11px] font-bold uppercase tracking-wider text-muted-grey">
              {['Customer Name & Contact','Category','Outstanding Balance','Last Payment','Avg Delay','Reliability','Risk','Actions'].map(h => <th key={h} className="py-3 px-4">{h}</th>)}
            </tr></thead>
            <tbody className="divide-y divide-light-lavender dark:divide-rich-plum/40 text-xs">
              {filtered.length === 0 ? (<tr><td colSpan="8" className="py-12 text-center text-muted-grey">No customers match the current filter criteria.</td></tr>) : (
                filtered.map(c => (
                  <tr key={c.id} className="hover:bg-warm-ivory/60 dark:hover:bg-rich-plum/20 transition">
                    <td className="py-3.5 px-4"><div className="cursor-pointer" onClick={() => dispatch({ type: 'SELECT_CUSTOMER', payload: c.id })}><p className="font-bold text-charcoal dark:text-white hover:text-rich-teal transition">{c.name}</p><p className="text-[11px] text-muted-grey">{c.phone} • {c.email}</p></div></td>
                    <td className="py-3.5 px-4 text-muted-grey">{c.notes}</td>
                    <td className="py-3.5 px-4"><span className={`font-bold text-sm ${c.out > 25000 ? 'text-red-600' : c.out > 0 ? 'text-charcoal dark:text-white' : 'text-emerald-600'}`}>{formatCurrency(c.out)}</span></td>
                    <td className="py-3.5 px-4 text-muted-grey">{c.lastPayment ? <div><p className="font-medium text-charcoal dark:text-white">{formatCurrency(c.lastPayment.amount)}</p><p className="text-[10px]">{formatDate(c.lastPayment.date)}</p></div> : 'None recorded'}</td>
                    <td className="py-3.5 px-4"><span className={`font-medium ${c.pred.avgDelay <= 0 ? 'text-emerald-600' : c.pred.avgDelay > 15 ? 'text-red-600' : 'text-amber-600'}`}>{c.pred.avgDelay <= 0 ? 'On-time' : c.pred.avgDelay + ' days late'}</span></td>
                    <td className="py-3.5 px-4"><ReliabilityBadge score={c.pred.score} /></td>
                    <td className="py-3.5 px-4"><RiskTag riskCat={c.pred.riskCat} /></td>
                    <td className="py-3.5 px-4 text-right">
                      <div className="flex items-center justify-end space-x-1.5">
                        <button onClick={() => dispatch({ type: 'SELECT_CUSTOMER', payload: c.id })} className="p-1.5 rounded-lg text-rich-teal hover:bg-soft-mint dark:hover:bg-rich-plum transition"><Icon name="eye" className="w-4 h-4" /></button>
                        <button onClick={() => dispatch({ type: 'OPEN_MODAL', payload: { modal: 'edit_customer', data: c } })} className="p-1.5 rounded-lg text-muted-grey hover:bg-gray-100 dark:hover:bg-rich-plum transition"><Icon name="edit" className="w-4 h-4" /></button>
                        <button onClick={() => dispatch({ type: 'OPEN_MODAL', payload: { modal: 'confirm_delete', data: { type: 'customer', id: c.id, name: c.name } } })} className="p-1.5 rounded-lg text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 transition"><Icon name="trash" className="w-4 h-4" /></button>
                      </div>
                    </td>
                  </tr>
                ))
              )}
            </tbody>
          </table>
        </div>
        <div className="py-3 px-4 bg-warm-ivory dark:bg-rich-plum/30 border-t border-light-lavender flex items-center justify-between text-xs text-muted-grey">
          <span>Showing {filtered.length} of {customers.length} accounts</span>
          <span>Total Outstanding in view: <strong className="text-charcoal dark:text-white font-bold">{formatCurrency(filtered.reduce((s,c) => s + c.out, 0))}</strong></span>
        </div>
      </div>
    </div>
  );
};

const CustomerProfilePage = ({ customerId }) => {

  const outstanding = getOutstanding(customerId, state.transactions);
  const pred = calculatePrediction(customerId, state.transactions);
  const totalPaid = transactions.filter(t => t.type === 'payment').reduce((s,t) => s + Number(t.amount||0), 0);

  return (
    <div className="space-y-6 fade-in">

      <div className="bg-white dark:bg-royal-purple rounded-2xl p-6 border border-light-lavender shadow-card flex flex-col md:flex-row items-start md:items-center justify-between gap-6">

          <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-rich-plum to-royal-purple text-soft-mint flex items-center justify-center font-black text-2xl shadow-md">{customer.name.charAt(0)}</div>

            <div className="flex items-center space-x-2"><h2 className="text-xl font-bold text-charcoal dark:text-white">{customer.name}</h2><RiskTag riskCat={pred.riskCat} /></div>

              <span className="flex items-center space-x-1"><Icon name="phone" className="w-3.5 h-3.5 text-rich-teal" /><span>{customer.phone}</span></span>
              <span>•</span>
              <span className="flex items-center space-x-1"><Icon name="mail" className="w-3.5 h-3.5 text-rich-teal" /><span>{customer.email}</span></span>
              <span>•</span><span>Onboarded: {formatDate(customer.createdAt)}</span>
            </div>
          </div>

          <button onClick={() => dispatch({ type: 'OPEN_MODAL', payload: { modal: 'add_transaction', data: { customerId } } })} className="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold shadow-sm transition">+ Record Payment</button>

const SmartRemindersPage = () => {

  const [templateCustomer, setTemplateCustomer] = React.useState(customers[0]?.id || '');
  const [templateTone, setTemplateTone] = React.useState('polite');

  const selectedCust = customers.find(c => c.id === templateCustomer) || customers[0];
  const custOut = selectedCust ? getOutstanding(selectedCust.id, transactions) : 0;

  const filteredReminders = reminders.filter(r => {
    if (activeTab === 'upcoming') return r.status === 'pending' && r.scheduledDate >= '2026-10-30';
    if (activeTab === 'overdue') return r.status === 'pending' && r.type.toLowerCase().includes('overdue');
    if (activeTab === 'completed') return r.status === 'completed';
    return true;
  });

  const getTemplateText = () => {
    if (!selectedCust) return '';
    const name = selectedCust.name;
    const amt = formatCurrency(custOut);
    if (templateTone === 'polite') return `Hello ${name} ji, courteous reminder from Bharat Traders that an invoice balance of ${amt} is scheduled for clearance. Thank you for your continued partnership!`;
    if (templateTone === 'formal') return `Dear ${name}, this is an official statement reminder regarding outstanding receivables amounting to ${amt}. Kindly arrange payment via NEFT/RTGS to current account.`;
    if (templateTone === 'urgent') return `URGENT NOTICE: ${name}, your outstanding payment of ${amt} is significantly delayed. To maintain your credit account in active status, please process remittance today.`;
    return `Hi ${name}, hope you are doing well! Quick friendly check on the pending bill for ${amt}. Please let us know once transferred. Thanks!`;
  };

  return (
    <div className="space-y-6 fade-in">
      <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
        <div>
          <h2 className="text-xl font-bold text-charcoal dark:text-white">Smart Payment Reminders &amp; Nudges</h2>

        </button>

        {[
          { id: 'all', label: `All Reminders (${reminders.length})` },
          { id: 'upcoming', label: 'Upcoming Dues' },
          { id: 'overdue', label: 'Overdue Nudges' },

const ReportsPage = () => {
  const { state } = useApp();
  const { customers, transactions } = state;
  const [activeTab, setActiveTab] = React.useState('outstanding');

  const todayStr = new Date().toISOString().split('T')[0];

  const outstandingData = customers.map(c => ({
    name: c.name,
    phone: c.phone,
    outstanding: getOutstanding(c.id, transactions),
    pred: calculatePrediction(c.id, transactions),
  })).sort((a, b) => b.outstanding - a.outstanding);

  const totalOutstanding = outstandingData.reduce((s, r) => s + r.outstanding, 0);

  const monthlyData = (() => {
    const map = {};
    transactions.filter(t => t.type === 'payment').forEach(t => {
      const m = t.date.slice(0, 7);
      map[m] = (map[m] || 0) + Number(t.amount);
    });
    return Object.entries(map).sort(([a], [b]) => a.localeCompare(b)).slice(-6).map(([month, amt]) => ({
      month: new Date(month + '-01').toLocaleDateString('en-IN', { month: 'short', year: '2-digit' }),
      collected: amt,
    }));
  })();

  const overdueData = transactions.filter(t => t.type === 'credit' && t.dueDate && t.dueDate < todayStr).map(t => {
    const cust = customers.find(c => c.id === t.customerId);
    const daysOverdue = Math.floor((new Date(todayStr) - new Date(t.dueDate)) / 86400000);
    return { name: cust?.name || 'Unknown', amount: t.amount, dueDate: t.dueDate, daysOverdue, description: t.description };
  }).sort((a, b) => b.daysOverdue - a.daysOverdue);

  const tabs = [
    { id: 'outstanding', label: 'Outstanding Balances' },
    { id: 'monthly', label: 'Monthly Collections' },
    { id: 'overdue', label: 'Overdue Analysis' },
    { id: 'transactions', label: 'Full Transaction History' },
  ];

  const handleExport = (data, filename) => {
    if (!data.length) return;
    const keys = Object.keys(data[0]);
    const csv = [keys.join(','), ...data.map(row => keys.map(k => `"${row[k] ?? ''}"`).join(','))].join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename + '.csv'; a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div className="space-y-6 fade-in">
      <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
        <div>
          <h2 className="text-xl font-bold text-charcoal dark:text-white">Financial Reports</h2>
          <p className="text-xs text-muted-grey mt-0.5">Comprehensive receivable analytics, overdue reports, and collection summaries. Export to CSV or print.</p>
        </div>
        <button onClick={() => window.print()} className="px-4 py-2.5 bg-royal-purple hover:bg-rich-plum text-white text-xs font-bold rounded-xl shadow-sm flex items-center space-x-1.5 transition">
          <Icon name="document" className="w-4 h-4" /><span>Print Report</span>
        </button>
      </div>

      <div className="flex border-b border-light-lavender space-x-1 overflow-x-auto text-sm">
        {tabs.map(tab => (
          <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`pb-3 px-2 font-semibold whitespace-nowrap transition ${activeTab === tab.id ? 'text-rich-teal border-b-2 border-rich-teal' : 'text-muted-grey hover:text-charcoal dark:hover:text-white'}`}>{tab.label}</button>
        ))}
      </div>

      {activeTab === 'outstanding' && (
        <div className="space-y-4">
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            {[

                  e.target.nextSibling.style.display = 'flex';
                }}
              />
              <div style={{ display: 'none' }} className="w-full aspect-video bg-gradient-to-br from-royal-purple to-rich-plum flex flex-col items-center justify-center text-white rounded-xl">
                <Icon name="users" className="w-16 h-16 text-rich-teal mb-3" />
                <p className="font-bold text-lg">Application Development Team</p>
                <p className="text-sm text-soft-mint/70 mt-1">Place team-photo.jpg in the same folder</p>
              </div>
            </div>
            <div className="text-center mt-3">
              <p className="text-xs font-bold text-charcoal dark:text-white">APPLICATION BUILDERS</p>
              <p className="text-[11px] text-muted-grey mt-0.5">MBA Program — Fintech Application Development Project</p>
            </div>
          </div>

          <div className="bg-gradient-to-br from-soft-mint to-white dark:from-rich-plum/60 dark:to-royal-purple rounded-2xl p-5 border border-rich-teal/30 shadow-card">
            <h4 className="font-bold text-charcoal dark:text-white text-sm">Project Highlights</h4>
            <ul className="mt-3 space-y-2">
              {[
                'Single HTML file — zero server required',
                'Fully offline-capable with localStorage persistence',
                'Rule-based payment prediction algorithm',
                'Real-time dashboard KPIs computed from live data',
                'Dark mode, responsive design, CSV export',
                'Interactive cash flow calendar & risk scoring',
              ].map(h => (
                <li key={h} className="flex items-start space-x-2 text-xs text-charcoal dark:text-warm-ivory">
                  <span className="text-rich-teal font-bold shrink-0 mt-0.5">→</span><span>{h}</span>
                </li>
              ))}
            </ul>
          </div>
        </div>
      </div>
    </div>
  );
};

// --- PAGE 11: SETTINGS ---

const SettingsPage = () => {
  const { state, dispatch } = useApp();
  const [form, setForm] = React.useState({ ...state.settings });
  const [saved, setSaved] = React.useState(false);

  const handleSave = () => {
    dispatch({ type: 'UPDATE_SETTINGS', payload: form });
    dispatch({ type: 'ADD_TOAST', payload: { type: 'success', title: 'Settings Saved', message: 'Your business profile and preferences have been updated.' } });
    setSaved(true);
    setTimeout(() => setSaved(false), 3000);
  };

  const InputField = ({ label, field, type = 'text', placeholder }) => (
    <div>
      <label className="block text-xs font-bold uppercase tracking-wider text-muted-grey mb-1">{label}</label>
      <input
        type={type}
        value={form[field] || ''}
        onChange={e => setForm(f => ({ ...f, [field]: e.target.value }))}
        placeholder={placeholder}
        className="w-full px-3.5 py-2.5 rounded-lg border border-light-lavender bg-warm-ivory dark:bg-rich-plum/20 text-sm text-charcoal dark:text-white outline-none focus:ring-2 focus:ring-rich-teal/40 transition"
      />
    </div>
  );

  return (
    <div className="space-y-6 fade-in max-w-2xl">
      <div>
        <h2 className="text-xl font-bold text-charcoal dark:text-white">Settings</h2>
        <p className="text-xs text-muted-grey mt-0.5">Manage your business profile, preferences, and application data.</p>
      </div>

      {/* Business Profile */}
      <div className="bg-white dark:bg-royal-purple rounded-2xl p-6 border border-light-lavender shadow-card">
        <h3 className="font-bold text-sm text-charcoal dark:text-white mb-4 flex items-center space-x-2">
          <Icon name="settings" className="w-4 h-4 text-rich-teal" /><span>Business Profile</span>
        </h3>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          <InputField label="Business Name" field="businessName" placeholder="Your business name" />
          <InputField label="Owner Name" field="ownerName" placeholder="Your full name" />
          <InputField label="Phone Number" field="phone" type="tel" placeholder="10-digit mobile number" />
          <InputField label="Email Address" field="email" type="email" placeholder="business@example.com" />
          <div className="md:col-span-2">
            <InputField label="Business Address" field="address" placeholder="City, State, India" />
          </div>
        </div>
      </div>

      {/* Preferences */}
      <div className="bg-white dark:bg-royal-purple rounded-2xl p-6 border border-light-lavender shadow-card">
        <h3 className="font-bold text-sm text-charcoal dark:text-white mb-4 flex items-center space-x-2">
          <Icon name="settings" className="w-4 h-4 text-rich-teal" /><span>Preferences</span>
        </h3>
        <div className="space-y-4">
          <div>
            <label className="block text-xs font-bold uppercase tracking-wider text-muted-grey mb-1">Currency</label>
            <select value={form.currency || 'INR'} onChange={e => setForm(f => ({ ...f, currency: e.target.value }))} className="w-full px-3.5 py-2.5 rounded-lg border border-light-lavender bg-warm-ivory dark:bg-rich-plum/20 text-sm text-charcoal dark:text-white outline-none">
              <option value="INR">₹ INR — Indian Rupee</option>
              <option value="USD">$ USD — US Dollar</option>
              <option value="EUR">€ EUR — Euro</option>
            </select>
          </div>

          {/* Dark Mode Toggle */}
          <div className="flex items-center justify-between p-4 rounded-xl bg-warm-ivory dark:bg-rich-plum/30 border border-light-lavender">
            <div>
              <h4 className="text-sm font-bold text-charcoal dark:text-white">Dark Mode</h4>
              <p className="text-xs text-muted-grey mt-0.5">Switch between light and dark interface themes.</p>
            </div>
            <button
              onClick={() => {
                const newTheme = form.theme === 'dark' ? 'light' : 'dark';
                setForm(f => ({ ...f, theme: newTheme }));
                if (newTheme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
              }}
              className={`relative w-12 h-6 rounded-full transition-colors duration-300 focus:outline-none ${form.theme === 'dark' ? 'bg-rich-teal' : 'bg-light-lavender'}`}
            >
              <span className={`absolute top-1 w-4 h-4 bg-white rounded-full shadow transition-transform duration-300 ${form.theme === 'dark' ? 'translate-x-7' : 'translate-x-1'}`}></span>
            </button>
          </div>
        </div>
      </div>

      {/* Data Management */}
      <div className="bg-white dark:bg-royal-purple rounded-2xl p-6 border border-light-lavender shadow-card">
        <h3 className="font-bold text-sm text-charcoal dark:text-white mb-4 flex items-center space-x-2">
          <Icon name="download" className="w-4 h-4 text-rich-teal" /><span>Data Management</span>
        </h3>
        <div className="space-y-3">
          <div className="p-4 rounded-xl bg-warm-ivory dark:bg-rich-plum/30 border border-light-lavender">
            <h4 className="text-sm font-bold text-charcoal dark:text-white">Local Data Storage</h4>
            <p className="text-xs text-muted-grey mt-0.5">All KHATA data is stored securely in your browser's localStorage. No data is sent to any server.</p>
          </div>
          <button
            onClick={() => dispatch({ type: 'OPEN_MODAL', payload: { modal: 'reset_demo' } })}
            className="w-full py-2.5 border-2 border-red-300 text-red-600 hover:bg-red-50 dark:hover:bg-red-950/30 font-bold text-sm rounded-xl transition"
          >
            Reset to Demo Data
          </button>
        </div>
      </div>

      {/* Save Button */}
      <div className="flex items-center space-x-3">
        <button onClick={handleSave} className="px-8 py-3 bg-rich-teal hover:bg-[#2fa090] text-white font-bold text-sm rounded-xl shadow-glow-teal transition active:scale-95">
          {saved ? '✓ Saved!' : 'Save Settings'}
        </button>
        <button onClick={() => setForm({ ...state.settings })} className="px-6 py-3 border border-light-lavender text-muted-grey hover:text-charcoal dark:hover:text-white font-semibold text-sm rounded-xl transition">
          Cancel
        </button>
      </div>
    </div>
  );
};


// --- MAIN APP ---

const App = () => {
  const { state, dispatch } = useApp();

  React.useEffect(() => {
    if (state.settings.theme === 'dark') document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
  }, [state.settings.theme]);

  React.useEffect(() => {
    const handler = (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        dispatch({ type: 'TOGGLE_SEARCH' });
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [dispatch]);

  const renderPage = () => {
    switch (state.currentPage) {
      case 'dashboard':    return <DashboardPage />;
      case 'customers':   return <CustomersPage />;
      case 'transactions': return <TransactionsPage />;
      case 'predictions': return <PaymentPredictionsPage />;
      case 'reminders':   return <SmartRemindersPage />;
      case 'cashflow':    return <CashFlowPage />;
      case 'reports':     return <ReportsPage />;
      case 'plans':       return <SubscriptionPlansPage />;
      case 'builders':    return <AppBuildersPage />;
      case 'settings':    return <SettingsPage />;
      default:            return <DashboardPage />;
    }
  };

  return (
    <div className="flex h-screen overflow-hidden bg-warm-ivory dark:bg-charcoal">
      <Sidebar />
      <div className="flex-1 flex flex-col overflow-hidden lg:ml-64 transition-all duration-300">
        <TopNav />
        <main className="flex-1 overflow-y-auto p-4 lg:p-6">
          {renderPage()}
        </main>
      </div>
      <GlobalSearch />
      <NotificationsPanel />
      <ModalContainer />
      <ToastContainer />
    </div>
  );
};

const AppWithProvider = () => (
  <AppProvider>
    <App />
  </AppProvider>
);

const rootElement = document.getElementById('root');
if (rootElement) {
  const root = ReactDOM.createRoot(rootElement);
  root.render(<AppWithProvider />);
}
</script>
</body>
</html>
